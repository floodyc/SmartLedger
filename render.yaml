# Render Blueprint for SmartLedger
# Deploy both Next.js frontend and PostgreSQL database

services:
  # Next.js Web Service
  - type: web
    name: smartledger
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  # PostgreSQL Database
  - name: smartledger-db
    plan: free
    region: oregon
